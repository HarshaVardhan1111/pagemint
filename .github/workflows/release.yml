name: release

on:
  release:
    types: [published]  # publishing a GitHub release (Releases -> Draft a new release) uploads to PyPI
  workflow_dispatch:  # or run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    # List (or update) PageMint in the official MCP Registry once the PyPI upload is done.
    # GitHub's OIDC token proves the release comes from this repository: no secrets needed.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher (official MCP Registry CLI)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json (retries while PyPI makes the new version visible)
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Attempt $attempt failed; waiting 30 s for PyPI to show the new version..."
            sleep 30
          done
          exit 1
