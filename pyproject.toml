[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pagemint"
dynamic = ["version"]
description = "Free, open-source MCP server that turns web pages into clean Markdown for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harsha" }]
keywords = ["mcp", "scraper", "markdown", "crawler", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27,<1",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
pagemint = "pagemint.cli:main"

[project.urls]
Homepage = "https://github.com/HarshaVardhan1111/pagemint"
Issues = "https://github.com/HarshaVardhan1111/pagemint/issues"

[tool.hatch.version]
path = "src/pagemint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pagemint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
